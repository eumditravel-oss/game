<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>점심 룰렛</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="wrap">
    <header class="header">
      <h1>점심 룰렛 🎯</h1>
      <p class="sub">버튼 한 번 누르면 자동으로 돌아가서 당첨이 확정됩니다.</p>
    </header>

    <section class="stage">
      <div class="pointer" aria-hidden="true"></div>

      <div class="wheel-area">
        <div id="wheel" class="wheel" aria-label="룰렛"></div>
        <div class="hub" aria-hidden="true"></div>
      </div>
    </section>

    <section class="panel">
      <button id="spinBtn" class="btn">룰렛 돌리기</button>
      <button id="resetBtn" class="btn ghost" title="당첨표시만 초기화">초기화</button>

      <div class="result">
        <div class="label">당첨</div>
        <div id="resultText" class="value">-</div>
      </div>

      <details class="list">
        <summary>메뉴 리스트 보기</summary>
        <ul id="menuList"></ul>
      </details>
    </section>

    <footer class="footer">
      <small>GitHub Pages용 (HTML/CSS/JS)</small>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
